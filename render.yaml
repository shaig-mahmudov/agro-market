databases:
  - name: agromarket-db
    databaseName: agromarket
    user: agromarket
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: agromarket-api
    runtime: docker
    plan: free
    dockerfilePath: ./AgroMarket.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: DATABASE_URL
        fromDatabase:
          name: agromarket-db
          property: connectionString
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: agromarket-db
          property: connectionString
      - key: Jwt__Issuer
        value: AgroMarket.Api
      - key: Jwt__Audience
        value: AgroMarket.Clients
      - key: Jwt__SigningKey
        generateValue: true
      - key: Seed__Enabled
        value: "true"
      - key: Seed__SeedSampleData
        value: "true"
      - key: Seed__AutoMigrateOnStartup
        value: "true"
      - key: Auth__EnableBootstrapDemoOtp
        value: "true"
      - key: Auth__BootstrapOtpCode
        value: "123456"
      - key: Cors__AllowedOrigins
        value: "*"
